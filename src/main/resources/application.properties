spring.application.name=plataforma-sso
server.port=${SSO_PORT:8080}
server.address=${SSO_BIND:127.0.0.1}
spring.datasource.url=${SSO_DB_URL:jdbc:postgresql://localhost:5432/servicosocial}
spring.datasource.username=${SSO_DB_USER:sso_app}
spring.datasource.password=${SSO_DB_PASSWORD:}
spring.sql.init.mode=always
spring.thymeleaf.cache=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
